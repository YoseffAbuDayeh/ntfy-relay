services:
  ntfy:
    image: binwiederhier/ntfy    
    command: serve
    ports: ["8090:80"]  
    volumes: ["./ntfy-cache:/var/cache/ntfy"]
    restart: unless-stopped

  acc1:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./notify.py:/app/notify.py:ro"]
    command: sh -c "pip install -q discord.py-self aiohttp && python notify.py"
    environment:
      NTFY_URL: http://ntfy/DMs
      DISCORD_TOKEN: ${TOKEN1}
      ACCOUNT: main
    depends_on: [ntfy]
    restart: unless-stopped